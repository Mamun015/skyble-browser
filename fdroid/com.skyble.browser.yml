AutoName: Skyble Browser
Summary: Fast, light browser with tabs, ad blocking and downloads
Description: |-
  A small web browser with no ads, no tracking and no account.

  Tabs, bookmarks, history, ad and tracker host blocking, in-app downloads,
  four themes including forced dark pages, English and Bengali interface, and
  a built-in update check. The app ships no browser engine: pages are drawn by
  the Android System WebView already installed on the device, which keeps the
  APK under one megabyte.

