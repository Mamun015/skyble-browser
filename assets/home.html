<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title data-i18n="title">হোম</title>
<style>
  :root{
    --bg:#FFFFFF; --surface:#F3F7F5; --text:#0D1412; --muted:#667471;
    --accent:#007A5A; --on-accent:#FFFFFF; --surface2:#E9F0EC;
    --line:#E4EBE7; --danger:#B3261E; --shadow:0 1px 2px rgba(13,20,18,.05);
  }
  html.dark{
    --bg:#080B0A; --surface:#121715; --text:#EAF1EE; --muted:#8D9A95;
    --accent:#34D399; --on-accent:#04241B; --surface2:#1A211E;
    --line:#1F2724; --danger:#FFB4AB; --shadow:none;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg)}
  body{
    color:var(--text);padding:20px 16px 36px;
    font-family:"Noto Sans Bengali","Hind Siliguri",sans-serif;
    transition:background .2s;
  }
  .head{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .logo{
    width:46px;height:46px;border-radius:14px;flex:none;display:block;
    box-shadow:var(--shadow);
  }
  .head h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px}
  .head p{margin:3px 0 0;font-size:12px;color:var(--muted)}
  form{
    display:flex;align-items:center;gap:8px;
    background:var(--surface2);
    border-radius:20px;padding:5px 5px 5px 15px;
  }
  form svg{flex:none;opacity:.5}
  input{
    flex:1;border:0;background:transparent;color:var(--text);
    font-size:15px;font-family:inherit;outline:none;padding:11px 0;
  }
  input::placeholder{color:var(--muted)}
  button{
    border:0;background:var(--accent);color:var(--on-accent);font-family:inherit;
    font-size:14px;font-weight:600;padding:11px 18px;border-radius:15px;
  }
  button:active{transform:scale(.97)}
  h2{
    font-size:12px;color:var(--muted);font-weight:600;
    margin:28px 0 12px;letter-spacing:.3px;
  }
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .tile{
    display:flex;flex-direction:column;align-items:center;gap:7px;
    background:var(--surface2);
    border-radius:16px;padding:13px 4px 11px;text-decoration:none;color:var(--text);
    overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  .tile:active{transform:scale(.96)}
  .tile .ico{font-size:21px;line-height:1;height:22px}
  .tile .fav{width:26px;height:26px;border-radius:8px;display:block;object-fit:contain}
  .tile .nm{
    width:100%;min-height:26px;
    font-size:10.5px;color:var(--muted);text-align:center;line-height:1.25;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
    overflow:hidden;text-overflow:ellipsis;
    word-wrap:break-word;overflow-wrap:anywhere;
  }
  .tile .nm.sm{font-size:9px;line-height:1.2}
  .tile .nm.xs{font-size:8px;line-height:1.2}
  .recent a{
    display:block;padding:13px 0;border-bottom:1px solid var(--line);
    text-decoration:none;color:var(--text);font-size:14px;
  }
  .recent a:last-child{border-bottom:0}
  .recent .u{display:block;font-size:11px;color:var(--muted);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .recent .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .empty{font-size:12.5px;color:var(--muted);line-height:1.7}
  .tiles .empty{grid-column:1/-1;text-align:center;padding:6px 2px}
  .hide{display:none}
  .tile{transition:transform .12s ease}
  .tile.dragging{
    opacity:.92;transform:scale(1.06);position:relative;z-index:5;
    box-shadow:0 10px 22px rgba(0,0,0,.25);pointer-events:none;
  }
  .tile.add{
    background:transparent;border:2px dashed var(--line);justify-content:center;
  }
  .tile.add .plus{font-size:24px;line-height:1;font-weight:700;color:var(--muted)}
  .sheet-bg{
    position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.45);
    z-index:30;display:flex;align-items:flex-end;
  }
  .sheet{
    width:100%;background:var(--surface);border-radius:24px 24px 0 0;
    padding:16px 14px 26px;box-sizing:border-box;
  }
  .sheet h3{margin:0;font-size:15px;color:var(--text);font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sheet p{margin:4px 0 14px;font-size:11.5px;color:var(--muted)}
  .sheet button{
    display:block;width:100%;text-align:left;border:0;background:var(--surface2);
    color:var(--text);font-family:inherit;font-size:14.5px;font-weight:600;
    padding:14px 16px;border-radius:16px;margin-bottom:8px;
  }
  .sheet button.danger{color:var(--danger)}
  .sheet button.cancel{background:transparent;color:var(--muted);text-align:center}
  footer{margin-top:34px;text-align:center;font-size:11px;color:var(--muted)}
  footer b{color:var(--accent);font-weight:600}
</style>
</head>
<body>

  <div class="head">
    <img class="logo" src="icon.png" alt="Skyble Browser" id="logo">
    <div>
      <h1 data-i18n="brand">Skyble Browser</h1>
      <p data-i18n="subtitle">দ্রুত, সহজ, বাংলায়</p>
    </div>
  </div>

  <form onsubmit="event.preventDefault();search()">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
    </svg>
    <input id="q" type="search" data-i18n-placeholder="placeholder" placeholder="গুগলে সার্চ করুন" autocomplete="off" enterkeyhint="search">
    <button type="submit" data-i18n="button">খুঁজুন</button>
  </form>

  <h2 data-i18n="fav">প্রিয় সাইট</h2>
  <div class="tiles" id="tiles">
    <p class="empty" id="noSites" data-i18n="emptySites">এখনো সাইট নেই। নিচের + চেপে যোগ করুন।</p>
  </div>

  <h2 data-i18n="recent">সাম্প্রতিক</h2>
  <div class="recent" id="recent">
    <p class="empty" id="empty" data-i18n="empty">এখনো কিছু দেখা হয়নি। উপরের বাক্সে লিখে শুরু করুন।</p>
  </div>

  <footer data-i18n-html="footer">Skyble Browser <b>1.2.5</b> · Made in Bangladesh</footer>

<script>
  var I18N = {
    bn: {
      title: "হোম",
      brand: "Skyble Browser",
      subtitle: "দ্রুত, সহজ, বাংলায়",
      placeholder: "গুগলে সার্চ করুন",
      button: "খুঁজুন",
      fav: "প্রিয় সাইট",
      recent: "সাম্প্রতিক",
      empty: "এখনো কিছু দেখা হয়নি। উপরের বাক্সে লিখে শুরু করুন।",
      emptySites: "এখনো সাইট নেই। নিচের + চেপে যোগ করুন।",
      removeSite: "এই সাইটটা হোম থেকে সরাবেন?",
      addSite: "সাইট যোগ", edit: "এডিট", remove: "মুছুন", cancel: "বাতিল",
      moveHint: "চেপে ধরে টেনে সরান, আর ট্যাপে এডিট/মুছুন",
      footer: "Skyble Browser <b>1.2.5</b> · Made in Bangladesh",
      t1: "প্রথম আলো", t2: "কালের কণ্ঠ", t3: "বিডিনিউজ", t4: "উইকিপিডিয়া",
      t5: "ইউটিউব", t6: "ফেসবুক", t7: "জিমেইল", t8: "বাংলানিউজ"
    },
    en: {
      title: "Home",
      brand: "Skyble Browser",
      subtitle: "Fast and simple",
      placeholder: "Search on Google",
      button: "Search",
      fav: "Favourite sites",
      recent: "Recent",
      empty: "Nothing here yet. Type above to start.",
      emptySites: "No sites yet. Tap + to add one.",
      removeSite: "Remove this site from the home grid?",
      addSite: "Add site", edit: "Edit", remove: "Delete", cancel: "Cancel",
      moveHint: "Press and hold, then drag to move. Tap for edit or delete.",
      footer: "Skyble Browser <b>1.2.5</b> · Made in Bangladesh",
      t1: "Prothom Alo", t2: "Kaler Kantho", t3: "BDNews24", t4: "Wikipedia",
      t5: "YouTube", t6: "Facebook", t7: "Gmail", t8: "Banglanews"
    }
  };

  // অ্যাপ ম্যাটেরিয়াল ইউ রং পাঠালে হোম পাতাও সেই রঙে রাঙা হয়
  window.BBTheme = function (bg, surface, surface2, text, muted, accent, onAccent, line, dark) {
    var r = document.documentElement.style;
    r.setProperty('--bg', bg);
    r.setProperty('--surface', surface);
    r.setProperty('--surface2', surface2);
    r.setProperty('--text', text);
    r.setProperty('--muted', muted);
    r.setProperty('--accent', accent);
    r.setProperty('--on-accent', onAccent);
    r.setProperty('--line', line);
    r.setProperty('--shadow', dark ? 'none' : '0 1px 2px rgba(0,0,0,.06)');
    document.documentElement.className = dark ? 'dark' : '';
  };

  var LANG = "bn";

  // অ্যাপ URL-এর hash-এ রং দেয়, তাই প্রথম আঁকাই ঠিক রঙে হয় — আগে সবুজ/সাদা ঝলক নেই
  function paintFromHash() {
    var map = {bg:'--bg', sf:'--surface', sf2:'--surface2', tx:'--text',
               mu:'--muted', ac:'--accent', oa:'--on-accent', ln:'--line'};
    var style = document.documentElement.style;
    for (var k in map) {
      var m = new RegExp("[&#]" + k + "=([0-9a-fA-F]{6})").exec(location.hash || "");
      if (m) style.setProperty(map[k], "#" + m[1]);
    }
  }

  function readEnv() {
    paintFromHash();
    var src = (location.search || "") + "&" + (location.hash || "");
    var m = /[?&#]lang=([^&#]*)/.exec(src);
    if (!m) m = /#(bn|en)\b/.exec(location.hash || "");
    LANG = "bn";
    if (m) {
      var v = decodeURIComponent(m[1]).toLowerCase();
      if (v.indexOf("en") === 0) LANG = "en";
    }
    var dark = (location.hash || "").indexOf("dark") >= 0;
    document.documentElement.className = dark ? "dark" : "";
    document.documentElement.style.setProperty(
        "--shadow", dark ? "none" : "0 1px 2px rgba(0,0,0,.06)");
  }

  function applyLang() {
    var d = I18N[LANG] || I18N.bn;
    document.documentElement.lang = LANG;
    var i;
    var nodes = document.querySelectorAll("[data-i18n]");
    for (i = 0; i < nodes.length; i++) {
      var k = nodes[i].getAttribute("data-i18n");
      if (d[k] != null) nodes[i].textContent = d[k];
    }
    var htmlNodes = document.querySelectorAll("[data-i18n-html]");
    for (i = 0; i < htmlNodes.length; i++) {
      var hk = htmlNodes[i].getAttribute("data-i18n-html");
      if (d[hk] != null) htmlNodes[i].innerHTML = d[hk];
    }
    var ph = document.querySelectorAll("[data-i18n-placeholder]");
    for (i = 0; i < ph.length; i++) {
      var pk = ph[i].getAttribute("data-i18n-placeholder");
      if (d[pk] != null) ph[i].setAttribute("placeholder", d[pk]);
    }
    document.title = d.title;
    var logo = document.getElementById("logo");
    if (logo) logo.setAttribute("alt", d.brand);
    fitNames(document.getElementById("tiles"));
  }

  readEnv();
  applyLang();
  window.addEventListener("hashchange", function () {
    readEnv();
    applyLang();
  });

  function search() {
    var q = document.getElementById("q").value.trim();
    if (!q) return;
    location.href = "skyble://search?q=" + encodeURIComponent(q);
  }

  /* --- tiles ------------------------------------------------------- */

  function fitNames(box) {
    if (!box) return;
    var nms = box.querySelectorAll(".nm");
    for (var i = 0; i < nms.length; i++) {
      var el = nms[i];
      var len = (el.textContent || "").replace(/\s+/g, " ").length;
      if (len > 22) el.classList.add("xs");
      else if (len > 13) el.classList.add("sm");
    }
  }

  window.setSites = function (list) {
    var box = document.getElementById("tiles");
    if (!box) return;
    // নতুন তালিকা এলে পুরোনো চাপ/টান/শিটের অবস্থা বাতিল
    stopPress();
    closeTileMenu();
    if (dragTile) dragTile.classList.remove("dragging");
    dragTile = null;
    document.body.classList.remove("dragging");
    var items = (list && list.length) ? list : [];
    var d = I18N[LANG] || I18N.bn;
    box.innerHTML = "";
    if (!items.length) {
      var p = document.createElement("p");
      p.className = "empty";
      p.id = "noSites";
      p.textContent = d.emptySites;
      box.appendChild(p);
    }
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      var a = document.createElement("a");
      a.className = "tile";
      a.href = item.u;
      a.title = item.n;
      a.setAttribute("data-url", item.u);
      var host = "";
      try { host = new URL(item.u).hostname.replace(/^www\./, ""); } catch (e) { }
      var img = document.createElement("img");
      img.className = "fav";
      img.alt = "";
      img.src = "https://www.google.com/s2/favicons?sz=64&domain=" + encodeURIComponent(host);
      img.onerror = function () {
        var fb = document.createElement("span");
        fb.className = "ico";
        fb.textContent = "🌐";
        if (this.parentNode) this.parentNode.replaceChild(fb, this);
      };
      a.appendChild(img);
      var nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = item.n;
      a.appendChild(nm);
      box.appendChild(a);
    }
    // শেষ ঘরটা প্লাস — নতুন সাইট যোগ করার জন্য
    var add = document.createElement("div");
    add.className = "tile add";
    var plus = document.createElement("span");
    plus.className = "plus";
    plus.textContent = "+";
    var lbl = document.createElement("span");
    lbl.className = "nm";
    lbl.textContent = d.addSite;
    add.appendChild(plus);
    add.appendChild(lbl);
    add.addEventListener("click", function () {
      if (window.BBHome && typeof window.BBHome.add === "function") {
        try { window.BBHome.add(); } catch (e) { }
      }
    });
    box.appendChild(add);
    fitNames(box);
  };

  window.setRecent = function (items) {
    if (!items || !items.length) return;
    var box = document.getElementById("recent");
    var empty = document.getElementById("empty");
    if (empty) empty.style.display = "none";
    for (var i = 0; i < items.length; i++) {
      var a = document.createElement("a");
      a.href = items[i].u;
      var t = document.createElement("span");
      t.className = "t";
      t.textContent = items[i].t;
      var u = document.createElement("span");
      u.className = "u";
      u.textContent = items[i].u.replace(/^https?:\/\//, "");
      a.appendChild(t);
      a.appendChild(u);
      box.appendChild(a);
    }
  };

  /* --- long press: drag to move, tap opens edit/delete ------------- */

  var LONG_PRESS_MS = 420;
  var MOVE_TOLERANCE = 8;
  var pressTimer = null;
  var pressTile = null;
  var pressX = 0;
  var pressY = 0;
  var dragTile = null;
  var dragMoved = false;
  var suppressClick = false;
  var lastTouchAt = 0;
  var sheetBox = null;

  function tileOf(node) {
    while (node && node !== document) {
      if (node.tagName === "A" && node.classList && node.classList.contains("tile")) return node;
      node = node.parentNode;
    }
    return null;
  }

  function isAddTile(node) {
    return !!node && !!node.classList && node.classList.contains("add");
  }

  function stopPress() {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    pressTile = null;
  }

  function startPress(tile, x, y) {
    stopPress();
    if (!tile || isAddTile(tile)) return;
    pressTile = tile;
    pressX = x;
    pressY = y;
    pressTimer = setTimeout(function () {
      pressTimer = null;
      beginDrag(tile);
    }, LONG_PRESS_MS);
  }

  function beginDrag(tile) {
    if (!tile) return;
    dragTile = tile;
    dragMoved = false;
    suppressClick = true;
    try { if (navigator.vibrate) navigator.vibrate(18); } catch (e) { }
    tile.classList.add("dragging");
    document.body.classList.add("dragging");
  }

  function dragMove(x, y) {
    if (!dragTile) return;
    if (Math.abs(x - pressX) > MOVE_TOLERANCE || Math.abs(y - pressY) > MOVE_TOLERANCE) {
      dragMoved = true;
    }
    if (!dragMoved) return;
    var over = tileOf(document.elementFromPoint(x, y));
    if (!over || over === dragTile || isAddTile(over)) return;
    var box = dragTile.parentNode;
    var kids = Array.prototype.slice.call(box.querySelectorAll(".tile:not(.add)"));
    var from = kids.indexOf(dragTile);
    var to = kids.indexOf(over);
    if (from < 0 || to < 0 || from === to) return;
    if (to > from) box.insertBefore(dragTile, over.nextSibling);
    else box.insertBefore(dragTile, over);
  }

  function tileUrls() {
    var out = [];
    var nodes = document.querySelectorAll("#tiles .tile:not(.add)");
    for (var i = 0; i < nodes.length; i++) out.push(nodes[i].getAttribute("data-url"));
    return out;
  }

  function endDrag() {
    if (!dragTile) return;
    var tile = dragTile;
    dragTile = null;
    tile.classList.remove("dragging");
    document.body.classList.remove("dragging");
    if (dragMoved) {
      if (window.BBHome && typeof window.BBHome.order === "function") {
        try { window.BBHome.order(JSON.stringify(tileUrls())); } catch (e) { }
      }
    } else {
      showTileMenu(tile);
    }
  }

  function sheetButton(label, cls, action) {
    var b = document.createElement("button");
    b.type = "button";
    if (cls) b.className = cls;
    b.textContent = label;
    b.addEventListener("click", action);
    return b;
  }

  function closeTileMenu() {
    if (sheetBox && sheetBox.parentNode) sheetBox.parentNode.removeChild(sheetBox);
    sheetBox = null;
  }

  function showTileMenu(tile) {
    closeTileMenu();
    var d = I18N[LANG] || I18N.bn;
    var url = tile.getAttribute("data-url") || "";
    var nm = tile.querySelector(".nm");
    var bg = document.createElement("div");
    bg.className = "sheet-bg";
    var sh = document.createElement("div");
    sh.className = "sheet";
    var h = document.createElement("h3");
    h.textContent = nm ? nm.textContent : url;
    sh.appendChild(h);
    var hint = document.createElement("p");
    hint.textContent = d.moveHint;
    sh.appendChild(hint);
    sh.appendChild(sheetButton(d.edit, "", function () {
      closeTileMenu();
      if (window.BBHome && typeof window.BBHome.edit === "function") {
        try { window.BBHome.edit(url); } catch (e) { }
      }
    }));
    sh.appendChild(sheetButton(d.remove, "danger", function () {
      closeTileMenu();
      var ok = false;
      try { ok = window.confirm(d.removeSite); } catch (e) { ok = false; }
      if (ok && window.BBHome && typeof window.BBHome.remove === "function") {
        try { window.BBHome.remove(url); } catch (e) { }
      }
    }));
    sh.appendChild(sheetButton(d.cancel, "cancel", closeTileMenu));
    bg.appendChild(sh);
    bg.addEventListener("click", function (e) {
      if (e.target === bg) closeTileMenu();
    });
    document.body.appendChild(bg);
    sheetBox = bg;
  }

  document.addEventListener("touchstart", function (e) {
    lastTouchAt = Date.now();
    suppressClick = false;
    if (sheetBox) {
      // শিটের ভেতরের চাপে শিট বন্ধ হবে না, নইলে বোতামের ক্লিকই হারিয়ে যায়
      if (sheetBox.contains(e.target)) { stopPress(); return; }
      closeTileMenu();
      suppressClick = true;   // বন্ধ হওয়া শিটের নিচের টাইলে ক্লিক যাবে না
      stopPress();
      return;
    }
    var t = tileOf(e.target);
    if (!t) { stopPress(); return; }
    var p = e.touches && e.touches[0];
    startPress(t, p ? p.clientX : 0, p ? p.clientY : 0);
  }, { passive: true });

  document.addEventListener("touchmove", function (e) {
    if (dragTile) {
      e.preventDefault();
      var p = e.touches && e.touches[0];
      if (p) dragMove(p.clientX, p.clientY);
      return;
    }
    if (!pressTile) return;
    var q = e.touches && e.touches[0];
    if (!q) return;
    if (Math.abs(q.clientX - pressX) > MOVE_TOLERANCE ||
        Math.abs(q.clientY - pressY) > MOVE_TOLERANCE) stopPress();
  }, { passive: false });

  document.addEventListener("touchend", function () {
    if (dragTile) endDrag(); else stopPress();
  }, { passive: true });
  document.addEventListener("touchcancel", function () {
    if (dragTile) endDrag(); else stopPress();
  }, { passive: true });

  document.addEventListener("mousedown", function (e) {
    if (Date.now() - lastTouchAt < 800) return;
    suppressClick = false;
    if (sheetBox) {
      if (sheetBox.contains(e.target)) { stopPress(); return; }
      closeTileMenu();
      suppressClick = true;
      stopPress();
      return;
    }
    var t = tileOf(e.target);
    if (!t) { stopPress(); return; }
    startPress(t, e.clientX, e.clientY);
  });

  document.addEventListener("mousemove", function (e) {
    if (dragTile) { dragMove(e.clientX, e.clientY); return; }
    if (!pressTile) return;
    if (Math.abs(e.clientX - pressX) > MOVE_TOLERANCE ||
        Math.abs(e.clientY - pressY) > MOVE_TOLERANCE) stopPress();
  });

  document.addEventListener("mouseup", function () {
    if (dragTile) endDrag(); else stopPress();
  });
  document.addEventListener("mouseleave", function () {
    if (dragTile) endDrag(); else stopPress();
  });

  document.addEventListener("click", function (e) {
    if (!suppressClick) return;
    suppressClick = false;
    e.preventDefault();
    e.stopPropagation();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
  }, true);

  document.addEventListener("contextmenu", function (e) {
    if (tileOf(e.target)) e.preventDefault();
  });

  document.addEventListener("dragstart", function (e) {
    if (tileOf(e.target)) e.preventDefault();
  });
</script>
</body>
</html>
